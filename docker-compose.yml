services:
  # InfluxDB service
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=api-metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application - Instance 1
  fastapi-app-1:
    build: .
    container_name: fastapi-app-1
    hostname: api-node-1
    ports:
      - "8001:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-secret-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=api-metrics
      - HOST_NAME=api-node-1 # Custom hostname for tracking
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  # FastAPI application - Instance 2 (for HA demonstration)
  fastapi-app-2:
    build: .
    container_name: fastapi-app-2
    hostname: api-node-2
    ports:
      - "8002:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-secret-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=api-metrics
      - HOST_NAME=api-node-2 # Custom hostname for tracking
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  # FastAPI application - Instance 3 (for HA demonstration)
  fastapi-app-3:
    build: .
    container_name: fastapi-app-3
    hostname: api-node-3
    ports:
      - "8003:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-secret-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=api-metrics
      - HOST_NAME=api-node-3 # Custom hostname for tracking
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  # Nginx load balancer (optional - for round-robin distribution)
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-app-1
      - fastapi-app-2
      - fastapi-app-3
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:

networks:
  monitoring:
    driver: bridge
